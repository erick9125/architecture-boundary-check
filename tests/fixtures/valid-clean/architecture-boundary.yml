version: 1

root: "src"

layers:
  - name: domain
    paths:
      - "domain/**"

  - name: application
    paths:
      - "application/**"

  - name: infrastructure
    paths:
      - "infrastructure/**"

rules:
  - from: domain
    cannotDependOn:
      - application
      - infrastructure

  - from: application
    cannotDependOn:
      - infrastructure
